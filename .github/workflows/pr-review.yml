name: PR store-risk review

# Triggers:
# - workflow_call from the target repo (no Cloudflare forwarder)
# - repository_dispatch from the App webhook forwarder (worker/)
# - workflow_dispatch for manual / branch testing
#
# repository_dispatch and workflow_call only see workflow files on the ref being
# used (default branch for dispatch; the pinned ref for call), so use
# workflow_dispatch when iterating on a branch of this repo.
on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number in the target repository
        required: true
        type: string
      mode:
        description: Which review to run (blank follows the branch prefix)
        required: false
        type: string
        default: ''
      target_repo:
        description: owner/name to review (defaults to caller repository)
        required: false
        type: string
        default: ''
      app_repository:
        description: Repo name (no owner) for App token scope; ignored when auth is github_token
        required: false
        type: string
        default: ''
      auth:
        description: github_app (mint installation token) or github_token (caller GITHUB_TOKEN)
        required: false
        type: string
        default: github_app
    secrets:
      CURSOR_API_KEY:
        required: true
      REVIEWER_APP_PRIVATE_KEY:
        required: false
  repository_dispatch:
    types: [pr_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number in the target repository
        required: true
        type: string
      mode:
        description: Which review to run (blank follows the branch prefix)
        required: false
        default: ''
        type: choice
        options: ['', docs, audit]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-review-${{ inputs.pr || github.event.client_payload.pr }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ inputs.pr || github.event.client_payload.pr }}
  MODE_OVERRIDE: ${{ inputs.mode || github.event.client_payload.mode || '' }}
  # Dispatch / workflow_dispatch: empty → resolvePr uses reviewer.config.json.
  # workflow_call: default to the caller repository unless target_repo is passed.
  TARGET_REPO_OVERRIDE: ${{ inputs.target_repo || (github.event_name == 'workflow_call' && github.repository) || '' }}
  APP_REPOSITORY: ${{ inputs.app_repository || 'ReactNativeApp' }}
  AUTH_MODE: ${{ inputs.auth || 'github_app' }}
  REPORT_FILE: ${{ github.workspace }}/ai_review_report.md
  SUMMARY_FILE: ${{ github.workspace }}/ai_review_summary.json

jobs:
  review:
    runs-on: ubuntu-latest
    container: node:22.14.0
    timeout-minutes: 30

    steps:
      - name: Check out reviewer
        uses: actions/checkout@v4
        with:
          # Always pin this reviewer repo. On reusable calls github.repository is the
          # caller and github.event_name stays pull_request, so detect by repository name.
          repository: pavlicevicvuk/store-risk-reviewer-vuk
          ref: ${{ github.repository == 'pavlicevicvuk/store-risk-reviewer-vuk' && github.sha || 'main' }}
          path: reviewer

      - name: Fix git container safe directory issue
        run: git config --global --add safe.directory '*'

      # Scoped to the target repo and read-only on contents: this token clones and comments,
      # it must never be able to push.
      - name: Mint app installation token
        id: app-token
        if: env.AUTH_MODE == 'github_app'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.APP_REPOSITORY }}
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: write
          permission-checks: write

      - name: Select API token
        id: token
        run: |
          if [ "${AUTH_MODE}" = "github_app" ]; then
            echo "value=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      # Metadata comes from the API rather than the webhook/call payload, so a forged or
      # stale dispatch cannot steer the run at a different branch or commit.
      - name: Resolve pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.value }}
          AI_REVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          AI_REVIEW_MODE_OVERRIDE: ${{ env.MODE_OVERRIDE }}
          AI_REVIEW_TARGET_REPO: ${{ env.TARGET_REPO_OVERRIDE }}
        run: node --experimental-strip-types reviewer/src/resolvePr.ts

      - name: Clone target repository
        if: steps.pr.outputs.run == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.value }}
          TARGET_REPO: ${{ steps.pr.outputs.target_repo }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: |
          # Blobless clone keeps the full commit graph (needed for the base...head merge
          # base) while skipping file contents until something actually reads them.
          git clone --filter=blob:none --no-checkout \
            "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" target
          cd target
          # refs/pull/N/head lives in the base repo, so fork pull requests need no special case.
          git fetch --filter=blob:none origin "refs/pull/${PR_NUMBER}/head" "${BASE_SHA}"
          git checkout --detach "${HEAD_SHA}"
          # The agent writes its prompt into a temp dir under the repo root; keep it from
          # showing up as an untracked change so the target repo needs no .gitignore entry.
          echo '.ai-review-tmp-*/' >> .git/info/exclude

      - name: Install Cursor CLI
        if: steps.pr.outputs.run == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          agent_path="$(find "$HOME" /usr/local /opt -name cursor-agent \( -type f -o -type l \) 2>/dev/null | head -1)"
          if [ -z "$agent_path" ]; then echo "cursor-agent not found after install" >&2; exit 1; fi
          ln -sf "$agent_path" /usr/local/bin/cursor-agent
          cursor-agent --version

      - name: Run diff review
        id: review_docs
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.mode == 'docs'
        continue-on-error: true
        working-directory: target
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_REPO_ROOT: ${{ github.workspace }}/target
          AI_REVIEW_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AI_REVIEW_OUTPUT: ${{ env.REPORT_FILE }}
          AI_REVIEW_SUMMARY: ${{ env.SUMMARY_FILE }}
        run: node --experimental-strip-types ../reviewer/src/index.ts

      - name: Run whole-repository audit
        id: review_audit
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.mode == 'audit'
        continue-on-error: true
        working-directory: target
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_REPO_ROOT: ${{ github.workspace }}/target
          AI_AUDIT_OUTPUT: ${{ env.REPORT_FILE }}
          AI_REVIEW_SUMMARY: ${{ env.SUMMARY_FILE }}
        run: node --experimental-strip-types ../reviewer/src/audit.ts

      - name: Post report to the pull request
        if: always() && steps.pr.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.value }}
          AI_REVIEW_TARGET_REPO: ${{ steps.pr.outputs.target_repo }}
          AI_REVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          AI_REVIEW_REPORT_FILE: ${{ env.REPORT_FILE }}
          AI_REVIEW_SUMMARY: ${{ env.SUMMARY_FILE }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AI_REVIEW_CHECK_NAME: AI store-risk review
        run: node --experimental-strip-types reviewer/src/postReport.ts

      - name: Surface review failure
        if: steps.review_docs.outcome == 'failure' || steps.review_audit.outcome == 'failure'
        run: |
          echo "The reviewer failed; its explanation was posted to the pull request." >&2
          exit 1

      - name: Report skip reason
        if: steps.pr.outputs.run != 'true'
        env:
          REASON: ${{ steps.pr.outputs.reason }}
        run: |
          echo "Skipped: $REASON"
